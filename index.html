<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24113d">
<title>Cumpleañossss Milaaaa 🎂</title>
<style>
:root{
 --bg:#f8f5fc;--card:#fff;--ink:#292333;--muted:#756d80;
 --purple:#7337d8;--pink:#e94b91;--line:#e9e3ef;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#f0e5ff 0,#fff5f8 35%,#fafafa 100%);
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
main{max-width:720px;margin:auto;padding:14px 13px 55px}
.hero{margin-top:4px;border-radius:30px;padding:29px 21px 25px;background:linear-gradient(145deg,#211034,#7135d4 62%,#df438b);color:#fff;box-shadow:0 18px 45px #57308024}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.7px;opacity:.75;font-weight:800}
h1{font-size:clamp(31px,8vw,50px);line-height:1.02;margin:9px 0 12px}
.hero p{line-height:1.5;margin:0;color:#f5efff}
.progress{display:flex;align-items:center;gap:10px;margin:15px 3px 5px;color:#71697b;font-size:12px;font-weight:700}
.bar{height:7px;flex:1;background:#ebe5f0;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));border-radius:99px;transition:.25s}
.card{background:#fff;border:1px solid var(--line);border-radius:25px;padding:21px 16px;margin-top:12px;box-shadow:0 9px 28px #3b20510b}
.kicker{font-size:12px;font-weight:800;color:#8051c4;text-transform:uppercase;letter-spacing:.6px}
h2{font-size:24px;line-height:1.15;margin:7px 0 8px}.desc{color:var(--muted);line-height:1.5;margin:0 0 15px}
.tip{background:#f6f0ff;color:#67419a;border-radius:15px;padding:11px 12px;font-size:13px;line-height:1.4;margin-bottom:12px}
.rank{display:flex;flex-direction:column;gap:9px}
.item{border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px 10px;display:flex;align-items:center;gap:9px;cursor:grab;touch-action:none;box-shadow:0 2px 6px #38214b08}
.item.dragging{opacity:.45}.handle{color:#aaa;font-size:18px}.num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#f0e8ff;color:#6732bf;font-size:12px;font-weight:800;flex:none}.label{line-height:1.3}
.option{border:1px solid var(--line);border-radius:16px;padding:13px 12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.option input{accent-color:var(--purple);width:19px;height:19px;flex:none;margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:9px}.tag{border:1px solid var(--line);border-radius:999px;padding:10px 12px;background:#fff;cursor:pointer;line-height:1.25}.tag.on{background:#efe6ff;border-color:#c7a8ff;color:#6331b7;font-weight:800}
.actions{display:flex;justify-content:space-between;gap:9px;margin-top:17px}.btn{border:0;border-radius:15px;padding:13px 17px;font-size:15px;font-weight:800;cursor:pointer}.back{background:#f0edf4;color:#51495b}.next{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;flex:1}
.result{overflow:hidden}.big{font-size:42px;margin:0}.resultbox{white-space:pre-wrap;background:#faf8fd;border:1px solid var(--line);padding:15px;border-radius:18px;font-size:13px;line-height:1.55;max-height:55vh;overflow:auto}
.small{text-align:center;color:#8b8391;font-size:11px;margin-top:17px}
.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
</head>
<body>
<main>
<section class="hero">
<div class="eyebrow">Una investigación completamente seria 🔎</div>
<h1 id="title"></h1>
<p id="subtitle"></p>
</section>
<div class="progress"><span id="ptext"></span><div class="bar"><div class="fill" id="fill"></div></div></div>
<div id="app"></div>
<div class="small">Responde según lo que realmente te provoque. 👀</div>
</main>

<script src="config.js"></script>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzAKb8mgbx8OmitzgnmlI9lrd3adZSaaDbjuYMwHDKAUcbeqsoCN1MUJcjzC8NMuBZp/exec";

const cfg = QUIZ_CONFIG;
const app = document.getElementById("app");
const ptext = document.getElementById("ptext");
const fill = document.getElementById("fill");

document.getElementById("title").textContent = cfg.title;
document.getElementById("subtitle").textContent = cfg.subtitle + " " + cfg.intro;

let step = 0;
let ans = {};

function render() {
  if (step >= cfg.sections.length) {
    result();
    return;
  }

  const s = cfg.sections[step];
  ptext.textContent = `Pregunta ${step + 1} de ${cfg.sections.length}`;
  fill.style.width = `${((step + 1) / cfg.sections.length) * 100}%`;

  app.innerHTML = "";

  const card = document.createElement("section");
  card.className = "card";

  const kicker = document.createElement("div");
  kicker.className = "kicker";
  kicker.textContent = s.emoji || "💜";

  const heading = document.createElement("h2");
  heading.textContent = s.title;

  const desc = document.createElement("p");
  desc.className = "desc";
  desc.textContent = s.instruction || "";

  card.append(kicker, heading, desc);

  let choices;

  if (s.type === "rank") {
    choices = rank(s);
  } else if (s.type === "multi") {
    choices = multi(s);
  } else {
    choices = single(s);
  }

  card.appendChild(choices);

  const actions = document.createElement("div");
  actions.className = "actions";

  if (step > 0) {
    const back = document.createElement("button");
    back.className = "btn back";
    back.textContent = "← Anterior";
    back.onclick = () => {
      saveCurrent(s);
      step--;
      render();
    };
    actions.appendChild(back);
  }

  const next = document.createElement("button");
  next.className = "btn next";
  next.textContent = step === cfg.sections.length - 1
    ? "Terminar 💜"
    : "Siguiente →";
  next.onclick = () => go(s);

  actions.appendChild(next);
  card.appendChild(actions);
  app.appendChild(card);
}

function rank(s) {
  const wrap = document.createElement("div");
  const tip = document.createElement("div");
  tip.className = "tip";
  tip.textContent = "☝️ Arrastra para ordenar tus preferencias.";
  wrap.appendChild(tip);

  const list = document.createElement("div");
  list.className = "rank";

  const order = ans[s.id] || s.options.map((_, i) => i);
  order.forEach(i => list.appendChild(makeItem(s.options[i], i, list)));
  nums(list);
  wrap.appendChild(list);
  return wrap;
}

function makeItem(txt, i, list) {
  const el = document.createElement("div");
  el.className = "item";
  el.draggable = true;
  el.dataset.i = i;

  const handle = document.createElement("span");
  handle.className = "handle";
  handle.textContent = "☰";

  const number = document.createElement("span");
  number.className = "num";

  const label = document.createElement("span");
  label.className = "label";
  label.textContent = txt;

  el.append(handle, number, label);

  el.addEventListener("dragstart", () => el.classList.add("dragging"));
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
    nums(list);
  });

  el.addEventListener("dragover", ev => {
    ev.preventDefault();
    const dragged = list.querySelector(".dragging");
    if (!dragged || dragged === el) return;
    const r = el.getBoundingClientRect();
    list.insertBefore(
      dragged,
      ev.clientY > r.top + r.height / 2 ? el.nextSibling : el
    );
    nums(list);
  });

  return el;
}

function nums(list) {
  [...list.children].forEach((el, i) => {
    el.querySelector(".num").textContent = i + 1;
  });
}

function multi(s) {
  const wrap = document.createElement("div");
  wrap.className = "tags";
  const selected = ans[s.id] || [];

  s.options.forEach((txt, i) => {
    const tag = document.createElement("button");
    tag.type = "button";
    tag.className = "tag" + (selected.includes(i) ? " on" : "");
    tag.textContent = txt;

    tag.onclick = () => {
      let values = ans[s.id] || [];

      if (values.includes(i)) {
        values = values.filter(x => x !== i);
      } else if (values.length < (s.max || 3)) {
        values = [...values, i];
      } else {
        alert("Máximo " + (s.max || 3) + " opciones 😉");
        return;
      }

      ans[s.id] = values;
      tag.classList.toggle("on", values.includes(i));
    };

    wrap.appendChild(tag);
  });

  return wrap;
}

function single(s) {
  const wrap = document.createElement("div");

  s.options.forEach((txt, i) => {
    const label = document.createElement("label");
    label.className = "option";

    const input = document.createElement("input");
    input.type = "radio";
    input.name = s.id;
    input.checked = ans[s.id] === i;
    input.onchange = () => ans[s.id] = i;

    const span = document.createElement("span");
    span.textContent = txt;

    label.append(input, span);
    wrap.appendChild(label);
  });

  return wrap;
}

function saveCurrent(s) {
  if (s.type === "rank") {
    const list = app.querySelector(".rank");
    if (list) ans[s.id] = [...list.children].map(el => Number(el.dataset.i));
  }
}

function go(s) {
  saveCurrent(s);

  if (s.type === "single" && ans[s.id] === undefined) {
    alert("Escoge una opción antes de continuar 💜");
    return;
  }

  if (s.type === "multi" && !(ans[s.id] && ans[s.id].length)) {
    alert("Escoge al menos una opción 💜");
    return;
  }

  step++;
  render();
}

async function result() {
  ptext.textContent = "¡Completado!";
  fill.style.width = "100%";

  app.innerHTML = `
    <section class="card result">
      <p class="big">💜</p>
      <h2>¡Gracias por responder!</h2>
      <p class="desc">
        ¡Investigación completada! 🥳
        Gracias por ayudar a que el cumpleaños sea especial.
      </p>
    </section>
  `;

  const datos = { answers: {} };

  cfg.sections.forEach(s => {
    const value = ans[s.id];

    if (s.type === "rank" || s.type === "multi") {
      datos.answers[s.title] = (value || []).map(i => s.options[i]);
    } else {
      datos.answers[s.title] =
        value === undefined ? "" : s.options[value];
    }
  });

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(datos)
    });
  } catch (error) {
    console.error("Error enviando las respuestas:", error);
  }
}

render();
</script>
</body>
</html>
